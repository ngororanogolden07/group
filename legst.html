<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Registration</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #87cefa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.box {
    background: white;
    padding: 20px;
    width: 300px;
    border-radius: 10px;
}

h2 {
    text-align: center;
    margin-bottom: 15px;
}

label {
    display: block;
    margin-top: 10px;
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.gender {
    display: flex;
    gap: 10px;
    margin-top: 5px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 10px;
    background: #0088ff;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #006fd0;
}

.link {
    text-align: center;
    display: block;
    margin-top: 10px;
    font-size: 13px;
    color: #0088ff;
    text-decoration: none;
}
</style>
</head>

<body>

<div class="box">
    <h2>Register</h2>

    <form action="login.html">
        <label>Full Name</label>
        <input type="text" placeholder="Enter name">

        <label>Email</label>
        <input type="email" placeholder="Enter email">

        <label>Password</label>
        <input type="password" placeholder="Enter password">

        <label>Gender</label>
        <div class="gender">
            <input type="radio" name="g"> Male
            <input type="radio" name="g"> Female
        </div>

        <label>District</label>
        <select>
            <option>Select district</option>
            <option>Karongi</option>
            <option>Rubavu</option>
            <option>Rutsiro</option>
            <option>Kirehe</option>
        </select>

        <label>Comment</label>
        <textarea></textarea>

        <button  type="submit">Register</button>
    </form>

    <a href="login.html" class="link">Already have account?</a>
</div>

</body>
</html>
