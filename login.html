<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <style>
    body {
      background-color: #0088ff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    .log {
      background-color: #333;
      color: white;
      border-radius: 20px;
      padding: 30px;
      text-align: center;
      width: 300px;
      box-shadow: 0 0 10px rgb(254, 0, 0);
    }

    .user {
      background-color: aqua;
      border-radius: 15px;
      padding: 20px;
      color: black;
      margin-bottom: 15px;
    }

    input {
      margin: 5px 0;
      padding: 8px;
      width: 90%;
      border: none;
      border-radius: 5px;
    }

    .login-btn {
      display: inline-block;
      background-color: #00bcd4;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(251, 5, 5, 0.153);
    }

    .login-btn:hover {
      background-color: #07d8f0af;
      transform: scale(1.05);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
    }

    .register-link {
      margin-top: 15px;
      display: block;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .register-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="log">
    <div class="user">
      <label>Username:</label><br>
      <input type="text" placeholder="Enter username" required><br>
      <label>Password:</label><br>
      <input type="password" placeholder="Enter password" required><br>
    </div>
    <a href="#" class="login-btn">Login</a>

    <a href="legst.html" class="register-link">Don’t have an account? Register here</a>
  </div>
</body>
</html>
